# SoftwareOS Standards Index

global:
  auth-security:
    description: Nest AuthGuard on every mutating or private API endpoint, user ID only from the session, POST-only changes with an Origin check, only apps/api/src/auth touches tokens/hashes, secrets only on the API project, none in logs or NEXT_PUBLIC_
  git-workflow:
    description: Needs description - run /index-standards
  tech-stack:
    description: Next.js frontend (apps/web) + NestJS API (apps/api) monorepo with shared Zod; web never imports Prisma or secrets; Prisma 6 on Neon in the API; two Vercel projects

