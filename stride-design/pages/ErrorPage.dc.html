<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stride — Something went wrong</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/stride/tokens.css">
<link rel="stylesheet" href="ds/stride/components/bundle.css">
<script src="ds/stride/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
</style>
<style>@media (max-width: 760px){.m-pad{padding-left:16px !important;padding-right:16px !important}.m-hide{display:none !important}.m-full{max-width:none !important;position:static !important}.m-hero{min-height:520px !important}}</style>
</helmet>
<div style="width: 100%; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">

<x-import component-from-global-scope="Stride.Header" promo="$5 shipping · free on orders over $75" utility="{{utility}}" links="{{navLinks}}" cart-count="{{cartCount}}" home-href="Main.dc.html" search-href="Catalog.dc.html" account-href="Login.dc.html" wishlist-href="Wishlist.dc.html" cart-href="Cart.dc.html"></x-import>

<main id="main">
<div class="m-pad" style="max-width: 1280px; margin: 0 auto; padding: 96px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px; align-items: center;">
<div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 20px; align-items: flex-start;">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted);">Something went wrong</span>
<h1 style="margin: 0; font-family: var(--font-display); font-size: clamp(44px, 7vw, 72px); line-height: 0.92; font-weight: 800; text-transform: uppercase;">We tripped. Not you.</h1>
<p style="margin: 0; max-width: 460px; font-size: 18px; line-height: 27px;">This page didn’t load. Your cart and wishlist are safe. Try again, and if it keeps happening come back in a few minutes.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px;"><a href="Catalog.dc.html" class="st-btn st-btn--accent st-btn--md">Try again</a><a href="Main.dc.html" class="st-btn st-btn--outline st-btn--md">Back to home</a></div>
</div>
<div aria-hidden="true" style="flex: 1 1 360px; max-width: 480px; aspect-ratio: 4 / 3; overflow: hidden;"><x-import component-from-global-scope="Stride.ProductArt" kind="socks" color="#ffffff" accent="#0e0f0c" sole="#0e0f0c" bg="stone" view="angle"></x-import></div>
</div>
</main>
<dc-import name="Footer" hint-size="100%,380px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      utility: [{ label: 'My orders', href: 'AccountOrders.dc.html' }, { label: 'Sign up', href: 'Signup.dc.html' }, { label: 'Log in', href: 'Login.dc.html' }],
      cartCount: 2, cards: [1, 2, 3, 4, 5, 6],
      navLinks: ['Road', 'Trail', 'Race day', 'Shoes', 'Apparel', 'Gear'].map(function (l) { return { label: l, href: 'Catalog.dc.html' }; })
    };
  }
}
</script>
</body>
</html>
