<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stride — Order #STR-10482</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/stride/tokens.css">
<link rel="stylesheet" href="ds/stride/components/bundle.css">
<script src="ds/stride/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
</style>
<style>@media (max-width: 760px){.m-pad{padding-left:16px !important;padding-right:16px !important}.m-hide{display:none !important}.m-full{max-width:none !important;position:static !important}.m-hero{min-height:520px !important}}</style>
</helmet>
<div style="width: 100%; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">

<x-import component-from-global-scope="Stride.Header" promo="$5 shipping · free on orders over $75" utility="{{utility}}" links="{{navLinks}}" cart-count="{{zero}}" account-name="Dana" home-href="Main.dc.html" search-href="Catalog.dc.html" account-href="AccountOrders.dc.html" wishlist-href="Wishlist.dc.html" cart-href="Cart.dc.html"></x-import>
<main id="main">

<div class="m-pad" style="max-width: 960px; margin: 0 auto; padding: 40px 32px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px;">
<a href="AccountOrders.dc.html" style="font-size: 14px; font-weight: 600;">← Back to my account</a>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0; font-family: var(--font-display); font-size: clamp(40px, 6vw, 56px); line-height: 0.95; font-weight: 800; text-transform: uppercase;">Order #STR-10482</h1>
<span style="font-size: 15px; color: var(--ink-muted);">Placed Oct 5, 2026 · 2 items</span>
</div>
</div>

<section style="display: flex; flex-direction: column; border-top: 1px solid var(--line);">
<sc-for list="{{items}}" as="i" hint-placeholder-count="2">
<div style="display: flex; gap: 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line);">
<div style="width: 72px; height: 90px; flex: none; overflow: hidden;"><x-import component-from-global-scope="Stride.ProductArt" kind="{{i.art.kind}}" color="{{i.art.color}}" accent="{{i.art.accent}}" bg="{{i.art.bg}}"></x-import></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: 14px; line-height: 20px;"><a href="Product.dc.html" style="font-size: 16px; font-weight: 700; text-decoration: none;">{{i.name}}</a><span style="color: var(--ink-muted);">{{i.variant}} · Qty {{i.qty}} · {{i.unit}} each</span></div>
<span style="font-weight: 700; font-variant-numeric: tabular-nums;">{{i.total}}</span>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; font-size: 15px; max-width: 320px; margin-left: auto; width: 100%;">
<div style="display: flex; justify-content: space-between;"><span>Subtotal</span><span>$53.00</span></div>
<div style="display: flex; justify-content: space-between;"><span>Shipping</span><span>$5.00</span></div>
<div style="display: flex; justify-content: space-between; font-size: 18px;"><strong>Total</strong><strong>$58.00</strong></div>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; font-size: 14px; line-height: 20px;">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 20px; background: var(--surface-alt);"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;">Shipped to</span><span>Dana Levi<br>245 Park Ave<br>New York, NY 10017</span></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 20px; background: var(--surface-alt);"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;">Payment</span><span>Demo card ending 3456<br>Nothing was charged</span></div>
</div>
</div>

</main>
<dc-import name="Footer" hint-size="100%,380px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      utility: [{ label: 'Hi, Dana', href: 'AccountOrders.dc.html' }, { label: 'My orders', href: 'AccountOrders.dc.html' }, { label: 'Log out', href: 'Main.dc.html' }],
      zero: 0,
      navLinks: ['Road', 'Trail', 'Race day', 'Shoes', 'Apparel', 'Gear'].map(function (l) { return { label: l, href: 'Catalog.dc.html' }; }),
      items: [
        { art: { kind: 'tee', color: '#0e0f0c', accent: '#d4ff3a', bg: 'stone' }, name: 'Aero Knit Running Tee', variant: 'Size M', qty: 1, unit: '$35.00', total: '$35.00' },
        { art: { kind: 'socks', color: '#ffffff', accent: '#0e0f0c', bg: 'stone' }, name: 'Cushion Running Socks 3-Pack', variant: 'One size', qty: 1, unit: '$18.00', total: '$18.00' }
      ]
    };
  }
}
</script>
</body>
</html>
