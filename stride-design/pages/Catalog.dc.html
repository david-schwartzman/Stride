<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stride — Catalog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/stride/tokens.css">
<link rel="stylesheet" href="ds/stride/components/bundle.css">
<script src="ds/stride/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
</style>
<style>@media (max-width: 760px){.m-pad{padding-left:16px !important;padding-right:16px !important}.m-hide{display:none !important}.m-full{max-width:none !important;position:static !important}.m-hero{min-height:520px !important}}</style>
<style>.cat-search:focus-within{box-shadow:var(--focus-ring)}</style>
</helmet>
<div style="width: 100%; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">

<x-import component-from-global-scope="Stride.Header" utility="{{utility}}" promo="$5 shipping · free on orders over $75" links="{{navLinks}}" cart-count="{{cartCount}}" home-href="Main.dc.html" search-href="Catalog.dc.html" account-href="Login.dc.html" wishlist-href="Wishlist.dc.html" cart-href="Cart.dc.html"></x-import>

<main id="main">
<div class="m-pad" style="max-width: 1280px; margin: 0 auto; padding: 24px 32px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px;">

<!-- Title row: breadcrumb + "Shop all (N)" left; Hide filters + Sort by right (Nike listing pattern) -->
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; background: var(--surface);">
<div style="display: flex; flex-direction: column; gap: 6px;">
<nav aria-label="Breadcrumb" style="font-size: 13px; color: var(--ink-muted); display: flex; gap: 6px;"><a href="Main.dc.html" style="color: var(--ink-muted);">Home</a><span>/</span><span style="color: var(--ink);">Shop all</span></nav>
<h1 aria-live="polite" style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700;">{{title}}</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted);">A small range, picked for new runners. Every product has a plain-language tag that says who it's for.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: center; font-size: 16px;">
<button type="button" aria-pressed="{{showFilters}}" onClick="{{toggleFilters}}" style="display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 8px 0; font: inherit; font-size: 16px; color: var(--ink); cursor: pointer;">{{filterLabel}} <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10 M4 12h4 M12 12h8 M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></button>
<label style="display: inline-flex; align-items: center; gap: 8px;">Sort by
<select onChange="{{onSort}}" style="font: inherit; font-size: 15px; height: 40px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); color: var(--ink);">
<option value="featured">Featured</option><option value="asc">Price: low to high</option><option value="desc">Price: high to low</option>
</select>
</label>
</div>
</div>

<!-- Quick-pick tiles above the grid (like Nike's cushioning tiles) -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px;">
<sc-for list="{{runPills}}" as="r" hint-placeholder-count="3">
<button type="button" aria-pressed="{{r.on}}" onClick="{{r.toggle}}" style="display: flex; align-items: center; gap: 16px; padding: 12px; border: 2px solid {{r.border}}; background: var(--surface-alt); text-align: left; font: inherit; color: var(--ink); cursor: pointer;">
<span style="width: 72px; height: 72px; flex: none; overflow: hidden;"><x-import component-from-global-scope="Stride.ProductArt" kind="shoe" color="{{r.color}}" accent="{{r.accent}}" bg="{{r.bg}}"></x-import></span>
<span style="display: flex; flex-direction: column; gap: 2px;"><strong style="font-size: 16px;">{{r.label}}</strong><span style="font-size: 14px; color: var(--ink-muted);">{{r.text}}</span></span>
</button>
</sc-for>
</div>

<form role="search" class="cat-search" style="display: flex; align-items: center; gap: 10px; max-width: 460px; height: 44px; padding: 0 16px; border-radius: 999px; background: var(--surface-alt);">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"></path><path d="M20 20l-4-4"></path></svg>
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search by name</label>
<input id="q" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Search by name, e.g. trail shoe" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 15px; color: var(--ink); outline: none;">
</form>

<div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start;">

<!-- Filters: each control updates the URL (?category=&run=&gender=&min=&max=) -->
<sc-if value="{{showFilters}}" hint-placeholder-val="{{yes}}">
<aside aria-label="Filters" class="m-full" style="flex: 1 1 220px; max-width: 240px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 200px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<span style="font-family: var(--font-display); font-size: 24px; font-weight: 700; text-transform: uppercase;">Filters</span>
<button type="button" onClick="{{clearAll}}" style="background: none; border: 0; padding: 0; font: inherit; font-size: 14px; font-weight: 600; text-decoration: underline; color: var(--ink); cursor: pointer;">Clear all</button>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<fieldset style="border: 0; margin: 0; padding: 0 0 20px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px;">
<legend style="padding: 0; margin-bottom: 12px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;">{{g.title}}</legend>
<sc-for list="{{g.options}}" as="o" hint-placeholder-count="3">
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer;"><input type="checkbox" checked="{{o.on}}" onChange="{{o.toggle}}" style="width: 18px; height: 18px; accent-color: var(--ink);"> {{o.label}} <span style="margin-left: auto; color: var(--ink-muted); font-size: 13px;">{{o.count}}</span></label>
</sc-for>
</fieldset>
</sc-for>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px;">
<legend style="padding: 0; margin-bottom: 12px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;">Price range (USD)</legend>
<div style="display: flex; align-items: center; gap: 8px;">
<input type="number" aria-label="Minimum price" placeholder="Min" value="{{minP}}" onChange="{{onMin}}" style="width: 0; flex: 1; height: 44px; box-sizing: border-box; padding: 0 12px; font: inherit; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--surface); color: var(--ink);">
<span style="color: var(--ink-muted);">–</span>
<input type="number" aria-label="Maximum price" placeholder="Max" value="{{maxP}}" onChange="{{onMax}}" style="width: 0; flex: 1; height: 44px; box-sizing: border-box; padding: 0 12px; font: inherit; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--surface); color: var(--ink);">
</div>
</fieldset>
</aside>
</sc-if>

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px;">
<sc-if value="{{hasChips}}" hint-placeholder-val="{{no}}">
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="2">
<button type="button" onClick="{{c.remove}}" aria-label="Remove filter {{c.label}}" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--volt-soft); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">{{c.label}} <span aria-hidden="true">×</span></button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{hasResults}}" hint-placeholder-val="{{yes}}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, {{colMin}}), 1fr)); gap: 40px 20px;">
<sc-for list="{{results}}" as="p" hint-placeholder-count="9">
<x-import component-from-global-scope="Stride.ProductCard" name="{{p.name}}" category="{{p.meta}}" price="{{p.price}}" tag="{{p.tag}}" sold-out="{{p.soldOut}}" art="{{p.art}}" href="{{p.href}}"></x-import>
</sc-for>
</div>
</sc-if>

<!-- No results: offer next steps and popular picks — the title already shows (0) -->
<sc-if value="{{noResults}}" hint-placeholder-val="{{no}}">
<section aria-live="polite" style="display: flex; flex-direction: column; gap: 20px;">
<p style="margin: 0; font-size: 16px; line-height: 24px;">{{emptyText}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<x-import component-from-global-scope="Stride.Button" size="sm" on-click="{{clearAll}}">Clear search &amp; filters</x-import>
<sc-for list="{{tryWords}}" as="w" hint-placeholder-count="3">
<button type="button" onClick="{{w.pick}}" style="height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font: inherit; font-size: 14px; color: var(--ink); cursor: pointer;">{{w.label}}</button>
</sc-for>
</div>
<h2 style="margin: 16px 0 0; font-size: 22px; line-height: 28px; font-weight: 700;">Popular with beginners</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 40px 20px;">
<sc-for list="{{fallback}}" as="p" hint-placeholder-count="3">
<x-import component-from-global-scope="Stride.ProductCard" name="{{p.name}}" category="{{p.sub}}" price="{{p.price}}" tag="{{p.tag}}" art="{{p.art}}" href="Product.dc.html"></x-import>
</sc-for>
</div>
</section>
</sc-if>
</div>
</div>
</div>

</main>
<dc-import name="Footer" hint-size="100%,380px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"initialQuery":{"editor":"text","default":""},"$preview":{"width":1280,"height":6700}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: props.initialQuery || '', f: { category: [], run: [], gender: [] }, minP: '', maxP: '', sort: 'featured', showFilters: true };
  }
  renderVals() {
    var self = this, st = this.state;
    var A = function (kind, color, accent, bg, sole) { return { kind: kind, color: color, accent: accent, bg: bg, sole: sole }; };
    var P = [
      { art: A('shoe','#0e0f0c','#d4ff3a','stone'), name: 'Stride Glide Road Shoe', sub: 'Unisex road running shoe', category: 'Shoes', run: 'Road', gender: 'Unisex', price: 110, tag: 'Good for your first 5K', href: 'Product.dc.html' },
      { art: A('shoe','#f2f2ee','#d4ff3a','stone'), name: 'Cloudstep Cushion Shoe', sub: 'Women\'s road running shoe', category: 'Shoes', run: 'Road', gender: 'Women', price: 125, tag: 'Extra cushion for new runners', href: 'Product.dc.html' },
      { art: A('shoe','#5c5f57','#ffffff','stone'), name: 'Daily Miles Road Shoe', sub: 'Men\'s road running shoe', category: 'Shoes', run: 'Road', gender: 'Men', price: 95, tag: 'Comfy for easy runs', href: 'Product.dc.html' },
      { art: A('shoe','#ffffff','#0e0f0c','stone'), name: 'Easy Start Road Shoe', sub: 'Women\'s road running shoe', category: 'Shoes', run: 'Road', gender: 'Women', price: 89, tag: 'Best value first pair', href: 'Product.dc.html' },
      { art: A('shoe','#3a3d36','#d4ff3a','stone'), name: 'Ridge Trail Shoe', sub: 'Men\'s trail running shoe', category: 'Shoes', run: 'Trail', gender: 'Men', price: 135, tag: 'Great for trails', href: 'Product.dc.html' },
      { art: A('shoe','#5c5f57','#d4ff3a','stone'), name: 'Pathfinder Trail Shoe', sub: 'Women\'s trail running shoe', category: 'Shoes', run: 'Trail', gender: 'Women', price: 129, tag: 'Grip on dirt and gravel', href: 'Product.dc.html' },
      { art: A('shoe','#0e0f0c','#f2f2ee','stone'), name: 'Parkland Trail Shoe', sub: 'Unisex trail running shoe', category: 'Shoes', run: 'Trail', gender: 'Unisex', price: 115, tag: 'Roads and park paths', href: 'Product.dc.html' },
      { art: A('shoe','#d4ff3a','#0e0f0c','stone'), name: 'Tempo Race Shoe', sub: 'Unisex racing shoe', category: 'Shoes', run: 'Race day', gender: 'Unisex', price: 150, tag: 'Race-day ready', href: 'Product.dc.html' },
      { art: A('shoe','#ffffff','#d4ff3a','stone'), name: 'First Bib Race Shoe', sub: 'Women\'s racing shoe', category: 'Shoes', run: 'Race day', gender: 'Women', price: 140, tag: 'Light for your first race', href: 'Product.dc.html' },
      { art: A('shoe','#0e0f0c','#ffffff','stone'), name: 'Finish Line Race Shoe', sub: 'Men\'s racing shoe', category: 'Shoes', run: 'Race day', gender: 'Men', price: 145, tag: 'Light and springy for race morning', href: 'Product.dc.html' },
      { art: A('tee','#0e0f0c','#d4ff3a','stone'), name: 'Aero Knit Running Tee', sub: 'Men\'s running top', category: 'Apparel', run: 'Road', gender: 'Men', price: 35, tag: 'Stays dry on hot runs', href: 'Product.dc.html' },
      { art: A('tee','#f2f2ee','#0e0f0c','stone'), name: 'Breeze Running Tee', sub: 'Women\'s running top', category: 'Apparel', run: 'Road', gender: 'Women', price: 35, tag: 'Soft and doesn’t cling', href: 'Product.dc.html' },
      { art: A('shorts','#0e0f0c','#ffffff','stone'), name: 'Pace 5" Running Shorts', sub: 'Women\'s running shorts', category: 'Apparel', run: 'Road', gender: 'Women', price: 38, tag: 'Light and breathable', href: 'Product.dc.html' },
      { art: A('shorts','#3a3d36','#d4ff3a','stone'), name: 'Stride 7" Running Shorts', sub: 'Men\'s running shorts', category: 'Apparel', run: 'Road', gender: 'Men', price: 40, tag: 'Pocket for your keys', href: 'Product.dc.html' },
      { art: A('longsleeve','#3a3d36','#f2f2ee','stone'), name: 'Thermal Long-Sleeve Top', sub: 'Unisex long-sleeve top', category: 'Apparel', run: 'Trail', gender: 'Unisex', price: 55, tag: 'For cold mornings', soldOut: true, href: 'ProductSoldOut.dc.html' },
      { art: A('longsleeve','#0e0f0c','#d4ff3a','stone'), name: 'Dawn Long-Sleeve Top', sub: 'Women\'s long-sleeve top', category: 'Apparel', run: 'Road', gender: 'Women', price: 48, tag: 'Warm-up layer for cool runs', href: 'Product.dc.html' },
      { art: A('jacket','#d4ff3a','#0e0f0c','stone'), name: 'Packable Wind Jacket', sub: 'Unisex running jacket', category: 'Apparel', run: 'Trail', gender: 'Unisex', price: 85, tag: 'Light rain? No problem', href: 'Product.dc.html' },
      { art: A('jacket','#0e0f0c','#f2f2ee','stone'), name: 'Trail Shell Jacket', sub: 'Men\'s running jacket', category: 'Apparel', run: 'Trail', gender: 'Men', price: 95, tag: 'Keeps wind out on open trails', href: 'Product.dc.html' },
      { art: A('tee','#d4ff3a','#0e0f0c','stone'), name: 'Race Day Singlet', sub: 'Unisex running singlet', category: 'Apparel', run: 'Race day', gender: 'Unisex', price: 30, tag: 'Cool and light on race day', href: 'Product.dc.html' },
      { art: A('shorts','#0e0f0c','#d4ff3a','stone'), name: 'Race Split Shorts', sub: 'Women\'s running shorts', category: 'Apparel', run: 'Race day', gender: 'Women', price: 42, tag: 'Nothing to hold you back', href: 'Product.dc.html' },
      { art: A('socks','#ffffff','#0e0f0c','stone'), name: 'Cushion Running Socks 3-Pack', sub: 'Unisex running socks', category: 'Gear', run: 'Road', gender: 'Unisex', price: 18, tag: 'Blister-free first miles', href: 'Product.dc.html' },
      { art: A('socks','#0e0f0c','#d4ff3a','stone'), name: 'Trail Crew Socks', sub: 'Unisex trail socks', category: 'Gear', run: 'Trail', gender: 'Unisex', price: 16, tag: 'Keeps grit out', href: 'Product.dc.html' },
      { art: A('cap','#0e0f0c','#d4ff3a','stone'), name: 'Reflect Running Cap', sub: 'Unisex running cap', category: 'Gear', run: 'Road', gender: 'Unisex', price: 24, tag: 'Be seen at dawn', href: 'Product.dc.html' },
      { art: A('cap','#f2f2ee','#0e0f0c','stone'), name: 'Sun Shade Cap', sub: 'Unisex running cap', category: 'Gear', run: 'Trail', gender: 'Unisex', price: 22, tag: 'Shade on sunny runs', href: 'Product.dc.html' },
      { art: A('belt','#0e0f0c','#d4ff3a','stone'), name: 'Race Belt with Gel Loops', sub: 'Unisex race belt', category: 'Gear', run: 'Race day', gender: 'Unisex', price: 20, tag: 'Holds your bib and gels', href: 'Product.dc.html' },
      { art: A('belt','#3a3d36','#ffffff','stone'), name: 'Phone Running Belt', sub: 'Unisex running belt', category: 'Gear', run: 'Road', gender: 'Unisex', price: 25, tag: 'Phone stays put, no bounce', href: 'Product.dc.html' },
      { art: A('vest','#5c5f57','#d4ff3a','stone'), name: 'Trail Hydration Vest', sub: 'Unisex hydration vest', category: 'Gear', run: 'Trail', gender: 'Unisex', price: 65, tag: 'Water for longer runs', href: 'Product.dc.html' },
      { art: A('vest','#d4ff3a','#0e0f0c','stone'), name: 'Hi-Vis Running Vest', sub: 'Unisex reflective vest', category: 'Gear', run: 'Road', gender: 'Unisex', price: 28, tag: 'Drivers see you in the dark', href: 'Product.dc.html' },
      { art: A('socks','#d4ff3a','#0e0f0c','stone'), name: 'Race Day Low Socks', sub: 'Unisex running socks', category: 'Gear', run: 'Race day', gender: 'Unisex', price: 14, tag: 'Thin and snug for race morning', href: 'Product.dc.html' },
      { art: A('cap','#ffffff','#0e0f0c','stone'), name: 'Finish Line Visor', sub: 'Unisex running visor', category: 'Gear', run: 'Race day', gender: 'Unisex', price: 20, tag: 'Keeps sweat out of your eyes', href: 'Product.dc.html' }
    ];
    var q = st.q.trim().toLowerCase(), f = st.f;
    var min = st.minP === '' ? null : Number(st.minP), max = st.maxP === '' ? null : Number(st.maxP);
    var match = function (p, skip) {
      if (q && p.name.toLowerCase().indexOf(q) < 0) return false;
      for (var k in f) { if (k !== skip && f[k].length && f[k].indexOf(p[k]) < 0) return false; }
      if (min != null && p.price < min) return false;
      if (max != null && p.price > max) return false;
      return true;
    };
    var res = P.filter(function (p) { return match(p); });
    if (st.sort === 'asc') res.sort(function (a, b) { return a.price - b.price; });
    if (st.sort === 'desc') res.sort(function (a, b) { return b.price - a.price; });
    var toggle = function (k, v) { return function () {
      var cur = f[k].slice(), i = cur.indexOf(v); if (i < 0) cur.push(v); else cur.splice(i, 1);
      var nf = Object.assign({}, f); nf[k] = cur; self.setState({ f: nf });
    }; };
    var group = function (title, key, values) {
      return { title: title, options: values.map(function (v) {
        return { label: v, on: f[key].indexOf(v) >= 0, toggle: toggle(key, v), count: P.filter(function (p) { return p[key] === v && match(p, key); }).length };
      }) };
    };
    var chips = [];
    ['category', 'run', 'gender'].forEach(function (k) { f[k].forEach(function (v) { chips.push({ label: v, remove: toggle(k, v) }); }); });
    if (min != null || max != null) chips.push({ label: '$' + (min != null ? min : 0) + ' – ' + (max != null ? '$' + max : 'any'), remove: function () { self.setState({ minP: '', maxP: '' }); } });
    if (q) chips.push({ label: '“' + st.q + '”', remove: function () { self.setState({ q: '' }); } });
    return {
      yes: true, no: false, cartCount: 2,
      navLinks: ['Road', 'Trail', 'Race day', 'Shoes', 'Apparel', 'Gear'].map(function (l) { return { label: l, href: 'Catalog.dc.html' }; }),
      q: st.q, minP: st.minP, maxP: st.maxP,
      onQ: function (e) { self.setState({ q: e.target.value }); },
      onSort: function (e) { self.setState({ sort: e.target.value }); },
      onMin: function (e) { self.setState({ minP: e.target.value }); },
      onMax: function (e) { self.setState({ maxP: e.target.value }); },
      clearAll: function () { self.setState({ q: '', f: { category: [], run: [], gender: [] }, minP: '', maxP: '' }); },
      groups: [group('Run type', 'run', ['Road', 'Trail', 'Race day']), group('Category', 'category', ['Shoes', 'Apparel', 'Gear']), group('Gender', 'gender', ['Men', 'Women', 'Unisex'])],
      runPills: [['Road', 'Cushioned for pavement and parks', '#0e0f0c', '#d4ff3a', 'stone'], ['Trail', 'Grip for paths and hills', '#3a3d36', '#d4ff3a', 'stone'], ['Race day', 'Light and fast for the big morning', '#d4ff3a', '#0e0f0c', 'ink']].map(function (r) { var v = r[0], on = f.run.indexOf(v) >= 0; return { label: v, text: r[1], color: r[2], accent: r[3], bg: r[4], on: on, toggle: toggle('run', v), border: on ? 'var(--ink)' : 'transparent' }; }),
      utility: [{ label: 'My orders', href: 'AccountOrders.dc.html' }, { label: 'Sign up', href: 'Signup.dc.html' }, { label: 'Log in', href: 'Login.dc.html' }],
      showFilters: st.showFilters, filterLabel: st.showFilters ? 'Hide filters' : 'Show filters', colMin: st.showFilters ? '280px' : '400px',
      toggleFilters: function () { self.setState({ showFilters: !self.state.showFilters }); },
      title: 'Shop all (' + res.length + ')',
      chips: chips, hasChips: chips.length > 0,
      results: res.map(function (p) { return Object.assign({ href: 'Product.dc.html', soldOut: false }, p, { meta: p.sub }); }),
      hasResults: res.length > 0, noResults: res.length === 0,
      countLabel: res.length + (res.length === 1 ? ' product' : ' products'),
      emptyText: q ? 'Try a shorter word, or one of these:' : 'Try removing a filter or widening the price range.',
      tryWords: ['shoe', 'socks', 'tee'].map(function (w) { return { label: '\u201c' + w + '\u201d', pick: function () { self.setState({ q: w, f: { category: [], run: [], gender: [] }, minP: '', maxP: '' }); } }; }),
      fallback: P.filter(function (p) { return ['Stride Glide Road Shoe', 'Cushion Running Socks 3-Pack', 'Aero Knit Running Tee'].indexOf(p.name) >= 0; }),
    };
  }
}
</script>
</body>
</html>
