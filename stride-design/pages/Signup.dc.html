<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stride — Create an account</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/stride/tokens.css">
<link rel="stylesheet" href="ds/stride/components/bundle.css">
<script src="ds/stride/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
</style>
<style>@media (max-width: 760px){.m-pad{padding-left:16px !important;padding-right:16px !important}.m-hide{display:none !important}.m-full{max-width:none !important;position:static !important}.m-hero{min-height:520px !important}}</style>
</helmet>
<div style="width: 100%; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">

<x-import component-from-global-scope="Stride.Header" promo="$5 shipping · free on orders over $75" utility="{{utility}}" links="{{navLinks}}" cart-count="{{cartCount}}" home-href="Main.dc.html" search-href="Catalog.dc.html" account-href="Login.dc.html" wishlist-href="Wishlist.dc.html" cart-href="Cart.dc.html"></x-import>

<main id="main" style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 72px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 56px; align-items: stretch;">
<aside style="flex: 1 1 420px; min-height: 560px; position: relative; overflow: hidden; background: var(--surface-inverse); color: var(--on-inverse); display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 40px; box-sizing: border-box;">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 66%;"><x-import component-from-global-scope="Stride.ProductArt" kind="shoe" color="#d4ff3a" accent="#0e0f0c" sole="#ffffff" bg="transparent" view="angle"></x-import></div>
<span style="position: relative; font-family: var(--font-display); font-size: 64px; line-height: 0.9; font-weight: 800; text-transform: uppercase; color: var(--on-inverse);">Join Stride</span>
<span style="position: relative; font-size: 16px; line-height: 24px; max-width: 360px;">Save a wishlist, check out faster and see every order in one place.</span>
</aside>
<div style="flex: 1 1 380px; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 24px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0; font-family: var(--font-display); font-size: clamp(40px, 6vw, 56px); line-height: 0.95; font-weight: 800; text-transform: uppercase;">Create an account</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--ink-muted);">Check out, save a wishlist and see your orders.</p>
</div>

<form style="display: flex; flex-direction: column; gap: 20px;">
<x-import component-from-global-scope="Stride.Input" label="Name" auto-complete="name" default-value="Dana Levi"></x-import>
<x-import component-from-global-scope="Stride.Input" label="Email" type="email" auto-complete="email" default-value="dana.levi@example.com" error="An account with this email already exists. Log in instead."></x-import>
<x-import component-from-global-scope="Stride.Input" label="Password" type="password" auto-complete="new-password" hint="At least 8 characters."></x-import>
<a href="AccountOrders.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 999px; background: var(--ink); color: var(--surface); font-weight: 700; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none;">Create account</a>
</form>

<div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-top: 16px; border-top: 1px solid var(--line); font-size: 15px;">
<span>Already have an account?</span><a href="Login.dc.html" style="font-weight: 700;">Log in</a>
</div>
</div>
</main>

<dc-import name="Footer" hint-size="100%,380px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      utility: [{ label: 'My orders', href: 'AccountOrders.dc.html' }, { label: 'Sign up', href: 'Signup.dc.html' }, { label: 'Log in', href: 'Login.dc.html' }],
      cartCount: 2,
      navLinks: ['Road', 'Trail', 'Race day', 'Shoes', 'Apparel', 'Gear'].map(function (l) { return { label: l, href: 'Catalog.dc.html' }; })
    };
  }
}
</script>
</body>
</html>
